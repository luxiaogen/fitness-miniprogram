    <text x="0" y="222" fill="#F2F5EF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="23">放在一个轻量、可离线演示的小程序里。</text>
    <text x="0" y="272" fill="#6B7268" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">51 exercises · 4 plans · local-first</text>
  </g>

