<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">健身记 Fitness Mini Program</title>
  <desc id="desc">A dark Volt Gym themed overview of exercise library, workout records, calendar, statistics, and cloud or local persistence.</desc>
  <rect width="1200" height="420" rx="28" fill="#0E100E"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#313830" stroke-width="2"/>

  <g id="title-block" transform="translate(64 58)">
    <text x="0" y="0" fill="#C8F542" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="700" letter-spacing="3">WORKOUT LOG / 训练记录</text>
    <text x="0" y="70" fill="#F2F5EF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="56" font-weight="800">健身记</text>
    <text x="0" y="112" fill="#9BA398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="25">Fitness Mini Program</text>
